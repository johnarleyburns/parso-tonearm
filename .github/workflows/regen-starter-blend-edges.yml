name: Regenerate starter blend edges

on:
  workflow_dispatch:

concurrency:
  group: regen-starter-blend-edges
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Build StarterBlendEdgePlanner
        run: |
          set -euo pipefail
          swift build -c release --product StarterBlendEdgePlanner
      - name: Run against the fixed blend/edge sequence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/starter-blend-edges"
          .build/release/StarterBlendEdgePlanner \
            tools/starter-blends/structure-input.json \
            "$RUNNER_TEMP/starter-blend-edges/StarterBlendRuntimeData.swift" \
            | tee "$RUNNER_TEMP/starter-blend-edges/log.txt"
      - name: Upload generated runtime data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starter-blend-edges
          path: ${{ runner.temp }}/starter-blend-edges/
          retention-days: 7
