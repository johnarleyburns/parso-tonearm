name: iOS Build & TestFlight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1)
          sudo xcode-select -s /Applications/$XCODE
          xcodebuild -version

      - name: Accept Xcode License
        run: sudo xcodebuild -license accept

      - name: Structural guards (Swift 6, StoreKit boundary, codename leak)
        # One script rather than three inline blocks, so the same checks can be
        # run before pushing (`make ci-guards`). They were CI-only until
        # 2026-08-17, when the first push of the DJ work spent a whole test job
        # to report a one-second grep failure — and a false positive at that.
        run: bash scripts/check-ci-guards.sh

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-

      - name: Run Swift Package Tests
        run: |
          set -eo pipefail
          swift test 2>&1 | tee test.log

      - name: Upload Test Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test.log
          retention-days: 7

  testflight-build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - name: Check TestFlight Signing Configuration
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_PROVISIONING_PROFILE_BASE64 }}
          LEGACY_PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          WIDGETS_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.WIDGETS_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          WATCH_PROVISIONING_PROFILE_BASE64: ${{ secrets.WATCH_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -eo pipefail
          missing=()

          require_secret() {
            if [ -z "${!1}" ]; then
              missing+=("$2")
            fi
          }

          require_secret APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_BASE64
          require_secret APPLE_CERTIFICATE_PASSWORD APPLE_CERTIFICATE_PASSWORD
          require_secret KEYCHAIN_PASSWORD KEYCHAIN_PASSWORD
          require_secret APPSTORE_API_KEY_ID APPSTORE_API_KEY_ID
          require_secret APPSTORE_API_PRIVATE_KEY APPSTORE_API_PRIVATE_KEY
          require_secret APPSTORE_API_ISSUER_ID APPSTORE_API_ISSUER_ID
          require_secret TEAM_ID TEAM_ID
          require_secret SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64
          require_secret WIDGETS_EXTENSION_PROVISIONING_PROFILE_BASE64 WIDGETS_EXTENSION_PROVISIONING_PROFILE_BASE64
          require_secret WATCH_PROVISIONING_PROFILE_BASE64 WATCH_PROVISIONING_PROFILE_BASE64

          if [ -z "$APP_PROVISIONING_PROFILE_BASE64$LEGACY_PROVISIONING_PROFILE_BASE64" ]; then
            missing+=("APP_PROVISIONING_PROFILE_BASE64 or legacy PROVISIONING_PROFILE_BASE64")
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            echo "HAS_TESTFLIGHT_SECRETS=false" >> "$GITHUB_ENV"
            printf -v joined '%s, ' "${missing[@]}"
            echo "::notice::Skipping TestFlight archive; missing signing/upload secrets: ${joined%, }"
          else
            echo "HAS_TESTFLIGHT_SECRETS=true" >> "$GITHUB_ENV"
            echo "TestFlight signing configuration is complete"
          fi

      - name: Checkout
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest Xcode
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        run: |
          XCODE=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1)
          sudo xcode-select -s /Applications/$XCODE
          xcodebuild -version

      - name: Accept Xcode License
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        run: sudo xcodebuild -license accept

      - name: Write application credentials
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        env:
          TONEARM_JAMENDO_CLIENT_ID: ${{ secrets.TONEARM_JAMENDO_CLIENT_ID }}
        run: |
          # Application credentials (as distinct from user logins) have to reach
          # a shipped binary but must never enter the repo (§54.2). Config/Base
          # .xcconfig optionally includes this file; an absent secret leaves it
          # empty and the app reports the honest "not configured" state (§18A.6)
          # rather than shipping a fabricated key or failing the build.
          #
          # THIS STEP BELONGS TO THE ARCHIVE JOB, NOT THE TEST JOB. It lived in
          # `test` until 2026-08-16, where nothing reads an xcconfig — `swift
          # test` builds the SPM package — so every TestFlight build shipped
          # with an empty client id and every tester met the honest
          # "not configured" state instead of a genre library. The file has to
          # be written in the job that archives, after that job's own checkout.
          if [ -n "$TONEARM_JAMENDO_CLIENT_ID" ]; then
            printf 'TONEARM_JAMENDO_CLIENT_ID = %s\n' "$TONEARM_JAMENDO_CLIENT_ID" \
              > Config/Secrets.xcconfig
            echo "Jamendo client id written to Config/Secrets.xcconfig (value not logged)"
          else
            echo "::warning::TONEARM_JAMENDO_CLIENT_ID is not set — this build ships without"
            echo "::warning::a Jamendo key, so genre libraries will report themselves"
            echo "::warning::unavailable. Add the repository secret to enable them."
          fi

      - name: Install XcodeGen
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        run: brew install xcodegen

      - name: Fetch Core ML models
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        # The CLAP encoders are 137 MB and 240 MB, which GitHub refuses to hold
        # in the repository at all, so they are release assets pinned by tag and
        # sha256 in Config/models.lock. Without this step the archive would build
        # cleanly and ship semantic search reporting itself unavailable to every
        # tester — the same silent degradation the empty Jamendo key nearly
        # shipped. A failed download or a checksum mismatch fails the job.
        run: make models

      - name: Generate Xcode project
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        # `make project`, not bare `xcodegen generate`: the wrapper writes the
        # Config/models-odr.yml overlay from which converted model packages are
        # present — the CLAP pair fetched by the step above, and Demucs, which is
        # never here (its 210 MB package is gitignored and not pinned, so stems
        # stay honestly unavailable in a CI build). An unconditional entry for a
        # missing package fails the build at the asset-pack copy, which would
        # kill this job before it archives.
        run: make project

      - name: Import Distribution Certificate
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -eo pipefail
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o certificate.p12
          security import certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k build.keychain
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Write App Store Connect API Key
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -eo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_API_PRIVATE_KEY" \
            > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8

      - name: Cache SPM
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: spm-${{ hashFiles('project.yml', 'Package.swift', 'Package.resolved') }}
          restore-keys: spm-

      - name: Compute Version
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        run: |
          set -eo pipefail
          BUILD=$(git rev-list --count HEAD)
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "MKT_VERSION=0.1.$BUILD" >> "$GITHUB_ENV"
          echo "Marketing version: 0.1.$BUILD (build $BUILD)"

      - name: Import Provisioning Profile
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        env:
          APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_PROVISIONING_PROFILE_BASE64 }}
          LEGACY_PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          WIDGETS_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.WIDGETS_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          WATCH_PROVISIONING_PROFILE_BASE64: ${{ secrets.WATCH_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -eo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          APP_PROFILE="${APP_PROVISIONING_PROFILE_BASE64:-$LEGACY_PROVISIONING_PROFILE_BASE64}"
          printf '%s' "$APP_PROFILE" | base64 --decode \
            -o "$HOME/Library/MobileDevice/Provisioning Profiles/Parso_Tonearm_App_Store.mobileprovision"
          printf '%s' "$SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            -o "$HOME/Library/MobileDevice/Provisioning Profiles/Parso_Tonearm_Share_Extension.mobileprovision"
          printf '%s' "$WIDGETS_EXTENSION_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            -o "$HOME/Library/MobileDevice/Provisioning Profiles/Parso_Tonearm_Widgets_Extension.mobileprovision"
          printf '%s' "$WATCH_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            -o "$HOME/Library/MobileDevice/Provisioning Profiles/Parso_Tonearm_Watch_App_Store.mobileprovision"

      - name: Archive
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -eo pipefail
          xcodebuild archive \
            -project Tonearm.xcodeproj \
            -scheme Tonearm \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ./build/Tonearm.xcarchive \
            ARCHS="arm64 arm64_32" \
            MARKETING_VERSION="$MKT_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            "DEVELOPMENT_TEAM=$TEAM_ID" \
            2>&1 | tee build.log
          if [ ! -d "./build/Tonearm.xcarchive" ]; then
            echo "Archive not found — build failed"
            grep -E 'error:' build.log | head -20
            exit 1
          fi

      - name: Export IPA
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        run: |
          set -eo pipefail
          xcodebuild -exportArchive \
            -archivePath ./build/Tonearm.xcarchive \
            -exportPath ./output \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to TestFlight
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -eo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file output/Tonearm.ipa \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"

      - name: Upload Build Log on Failure
        if: failure() && env.HAS_TESTFLIGHT_SECRETS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Cleanup
        if: always() && env.HAS_TESTFLIGHT_SECRETS == 'true'
        run: |
          security delete-keychain build.keychain || true
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
