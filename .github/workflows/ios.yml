name: iOS Build & TestFlight
# PRs run the required validate job in pr-validation.yml once. This workflow
# tests merged main (or a manual dispatch) before signing and uploading.

on:
  push:
    branches: [main]
  workflow_dispatch:

# The TestFlight build number is the commit count, so two runs of one commit upload the same
# build and the second fails with a 409 (62c6cf8 was delivered as two push events 14 s apart).
# A duplicate cancels the earlier run long before either reaches the upload.
concurrency:
  group: ios-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: xcode-27
    # Generous vs. observed history (last ~3 days: median 7.5m, p90 8.6m, max
    # 12.2m) — matches this repo's own pr-validation.yml validate job, which
    # does comparable swift-test + guardrail work under the same allowance.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' ! -iname '*beta*' ! -iname '*rc*' -print | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          XCODE_VERSION=$(xcodebuild -version | awk 'NR==1 {print $2}')
          XCODE_MAJOR=${XCODE_VERSION%%.*}
          if [ "$XCODE_MAJOR" -lt 27 ]; then
            echo "::error::Xcode 27 or newer is required to build with the iOS 27 SDK (found $XCODE_VERSION)"
            exit 1
          fi

      - name: Accept Xcode License
        run: sudo xcodebuild -license accept

      # The guards search with ripgrep, which the macOS runner image doesn't carry.
      - name: Install ripgrep
        run: brew install ripgrep

      - name: Structural guards (Swift 6, StoreKit boundary, codename leak)
        # One script rather than three inline blocks, so the same checks can be
        # run before pushing (`make ci-guards`). They were CI-only until
        # 2026-08-17, when the first push of the DJ work spent a whole test job
        # to report a one-second grep failure — and a false positive at that.
        run: bash scripts/check-ci-guards.sh

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-

      - name: Run Swift Package Tests
        run: |
          set -eo pipefail
          swift test --no-parallel 2>&1 | tee test.log

      - name: Upload Test Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test.log
          retention-days: 7

  testflight-build:
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: xcode-27
    # Generous vs. observed history (last ~3 days: median 12.4m, p90 14.5m,
    # max 19.8m) — matches the equivalent archive+export+upload job's
    # allowance in parso-workout-ios-app (150m vs its own ~19.8m max).
    timeout-minutes: 150
    steps:
      - name: Check TestFlight Signing Configuration
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_PROVISIONING_PROFILE_BASE64 }}
          LEGACY_PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          WIDGETS_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.WIDGETS_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          SIRI_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.SIRI_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          WATCH_PROVISIONING_PROFILE_BASE64: ${{ secrets.WATCH_PROVISIONING_PROFILE_BASE64 }}
          WATCH_WIDGETS_PROVISIONING_PROFILE_BASE64: ${{ secrets.WATCH_WIDGETS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -eo pipefail
          missing=()

          require_secret() {
            if [ -z "${!1}" ]; then
              missing+=("$2")
            fi
          }

          require_secret APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_BASE64
          require_secret APPLE_CERTIFICATE_PASSWORD APPLE_CERTIFICATE_PASSWORD
          require_secret KEYCHAIN_PASSWORD KEYCHAIN_PASSWORD
          require_secret APPSTORE_API_KEY_ID APPSTORE_API_KEY_ID
          require_secret APPSTORE_API_PRIVATE_KEY APPSTORE_API_PRIVATE_KEY
          require_secret APPSTORE_API_ISSUER_ID APPSTORE_API_ISSUER_ID
          require_secret TEAM_ID TEAM_ID
          require_secret SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64
          require_secret WIDGETS_EXTENSION_PROVISIONING_PROFILE_BASE64 WIDGETS_EXTENSION_PROVISIONING_PROFILE_BASE64
          require_secret SIRI_EXTENSION_PROVISIONING_PROFILE_BASE64 SIRI_EXTENSION_PROVISIONING_PROFILE_BASE64
          require_secret WATCH_PROVISIONING_PROFILE_BASE64 WATCH_PROVISIONING_PROFILE_BASE64
          require_secret WATCH_WIDGETS_PROVISIONING_PROFILE_BASE64 WATCH_WIDGETS_PROVISIONING_PROFILE_BASE64

          if [ -z "$APP_PROVISIONING_PROFILE_BASE64$LEGACY_PROVISIONING_PROFILE_BASE64" ]; then
            missing+=("APP_PROVISIONING_PROFILE_BASE64 or legacy PROVISIONING_PROFILE_BASE64")
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            echo "HAS_TESTFLIGHT_SECRETS=false" >> "$GITHUB_ENV"
            printf -v joined '%s, ' "${missing[@]}"
            echo "::notice::Skipping TestFlight archive; missing signing/upload secrets: ${joined%, }"
          else
            echo "HAS_TESTFLIGHT_SECRETS=true" >> "$GITHUB_ENV"
            echo "TestFlight signing configuration is complete"
          fi

      - name: Checkout
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 27
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' ! -iname '*beta*' ! -iname '*rc*' -print | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          XCODE_VERSION=$(xcodebuild -version | awk 'NR==1 {print $2}')
          XCODE_MAJOR=${XCODE_VERSION%%.*}
          if [ "$XCODE_MAJOR" -lt 27 ]; then
            echo "::error::Xcode 27 or newer is required to build with the iOS 27 SDK (found $XCODE_VERSION)"
            exit 1
          fi

      - name: Accept Xcode License
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        run: sudo xcodebuild -license accept

      - name: Write application credentials
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        env:
          TONEARM_JAMENDO_CLIENT_ID: ${{ secrets.TONEARM_JAMENDO_CLIENT_ID }}
          TONEARM_DROPBOX_CLIENT_ID: ${{ secrets.TONEARM_DROPBOX_CLIENT_ID }}
          TONEARM_GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.TONEARM_GOOGLE_DRIVE_CLIENT_ID }}
          TONEARM_ONEDRIVE_CLIENT_ID: ${{ secrets.TONEARM_ONEDRIVE_CLIENT_ID }}
          TONEARM_PCLOUD_CLIENT_ID: ${{ secrets.TONEARM_PCLOUD_CLIENT_ID }}
          TONEARM_PCLOUD_CLIENT_SECRET: ${{ secrets.TONEARM_PCLOUD_CLIENT_SECRET }}
          TONEARM_BOX_CLIENT_ID: ${{ secrets.TONEARM_BOX_CLIENT_ID }}
          TONEARM_BOX_CLIENT_SECRET: ${{ secrets.TONEARM_BOX_CLIENT_SECRET }}
          TONEARM_YANDEX_CLIENT_ID: ${{ secrets.TONEARM_YANDEX_CLIENT_ID }}
          TONEARM_YANDEX_CLIENT_SECRET: ${{ secrets.TONEARM_YANDEX_CLIENT_SECRET }}
        run: |
          # Application credentials (as distinct from user logins) have to reach
          # a shipped binary but must never enter the repo (§54.2). Config/Base
          # .xcconfig optionally includes this file; an absent secret leaves it
          # empty and the app reports the honest "not configured" state (§18A.6)
          # rather than shipping a fabricated key or failing the build.
          #
          # THIS STEP BELONGS TO THE ARCHIVE JOB, NOT THE TEST JOB. It lived in
          # `test` until 2026-08-16, where nothing reads an xcconfig — `swift
          # test` builds the SPM package — so every TestFlight build shipped
          # with an empty client id and every tester met the honest
          # "not configured" state instead of a genre library. The file has to
          # be written in the job that archives, after that job's own checkout.
          : > Config/Secrets.xcconfig
          write_if_set() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              printf '%s = %s\n' "$name" "$value" >> Config/Secrets.xcconfig
            else
              echo "::warning::$name is not set — this build ships without it; add the repository secret to enable it."
            fi
          }
          write_if_set TONEARM_JAMENDO_CLIENT_ID "$TONEARM_JAMENDO_CLIENT_ID"
          write_if_set TONEARM_DROPBOX_CLIENT_ID "$TONEARM_DROPBOX_CLIENT_ID"
          write_if_set TONEARM_GOOGLE_DRIVE_CLIENT_ID "$TONEARM_GOOGLE_DRIVE_CLIENT_ID"
          write_if_set TONEARM_ONEDRIVE_CLIENT_ID "$TONEARM_ONEDRIVE_CLIENT_ID"
          write_if_set TONEARM_PCLOUD_CLIENT_ID "$TONEARM_PCLOUD_CLIENT_ID"
          write_if_set TONEARM_PCLOUD_CLIENT_SECRET "$TONEARM_PCLOUD_CLIENT_SECRET"
          write_if_set TONEARM_BOX_CLIENT_ID "$TONEARM_BOX_CLIENT_ID"
          write_if_set TONEARM_BOX_CLIENT_SECRET "$TONEARM_BOX_CLIENT_SECRET"
          write_if_set TONEARM_YANDEX_CLIENT_ID "$TONEARM_YANDEX_CLIENT_ID"
          write_if_set TONEARM_YANDEX_CLIENT_SECRET "$TONEARM_YANDEX_CLIENT_SECRET"
          echo "Application credentials written to Config/Secrets.xcconfig (values not logged)"

      - name: Install XcodeGen
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        run: brew install xcodegen

      - name: Fetch Core ML models
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        # The Demucs stems model is 210 MB, which GitHub refuses to hold in the
        # repository at all, so it is hosted in R2 and pinned by URL and sha256
        # in Config/models.lock. Without this step the archive would build
        # cleanly and ship stems reporting themselves unavailable to every
        # tester — the same silent degradation the empty Jamendo key nearly
        # shipped. A failed download or a checksum mismatch fails the job.
        run: make models

      - name: Generate Xcode project
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        # `make project`, not bare `xcodegen generate`: the wrapper writes the
        # Config/models-odr.yml overlay from which converted model packages are
        # present — the Demucs stems model, once the step above has fetched it.
        # An unconditional entry for a missing package fails the build at the
        # asset-pack copy, which would kill this job before it archives, and the
        # overlay is what keeps that impossible.
        run: make project

      - name: Import Distribution Certificate
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -eo pipefail
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o certificate.p12
          security import certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k build.keychain
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Write App Store Connect API Key
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -eo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_API_PRIVATE_KEY" \
            > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8

      - name: Cache SPM
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: spm-${{ hashFiles('project.yml', 'Package.swift', 'Package.resolved') }}
          restore-keys: spm-

      - name: Compute Version
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        run: |
          set -eo pipefail
          BUILD=$(git rev-list --count HEAD)
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          # App Store Connect requires the uploaded build's marketing version
          # to match the version being submitted. project.yml is the source of
          # truth; the repository variable may override it, but a mismatch
          # fails instead of silently uploading under the wrong version.
          project_version="$(ruby -ryaml -e 'puts YAML.load_file("project.yml").dig("settings", "base", "MARKETING_VERSION").to_s')"
          MKT_VERSION="${{ vars.TONEARM_MARKETING_VERSION }}"
          if [ -z "$MKT_VERSION" ]; then
            MKT_VERSION="$project_version"
          fi
          if [ -z "$MKT_VERSION" ]; then
            echo "::error title=Missing marketing version::Set project.yml MARKETING_VERSION or the TONEARM_MARKETING_VERSION repository variable."
            exit 1
          fi
          if [ -n "$project_version" ] && [ "$MKT_VERSION" != "$project_version" ]; then
            echo "::error title=Marketing version mismatch::Workflow would upload '$MKT_VERSION' but project.yml says '$project_version'. Align them before uploading."
            exit 1
          fi
          echo "MKT_VERSION=$MKT_VERSION" >> "$GITHUB_ENV"
          echo "Marketing version: $MKT_VERSION (build $BUILD, project.yml $project_version)"

      - name: Import Provisioning Profile
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        env:
          APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_PROVISIONING_PROFILE_BASE64 }}
          LEGACY_PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          WIDGETS_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.WIDGETS_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          SIRI_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.SIRI_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          WATCH_PROVISIONING_PROFILE_BASE64: ${{ secrets.WATCH_PROVISIONING_PROFILE_BASE64 }}
          WATCH_WIDGETS_PROVISIONING_PROFILE_BASE64: ${{ secrets.WATCH_WIDGETS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -eo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          APP_PROFILE="${APP_PROVISIONING_PROFILE_BASE64:-$LEGACY_PROVISIONING_PROFILE_BASE64}"
          printf '%s' "$APP_PROFILE" | base64 --decode \
            -o "$HOME/Library/MobileDevice/Provisioning Profiles/Parso_Tonearm_App_Store.mobileprovision"
          printf '%s' "$SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            -o "$HOME/Library/MobileDevice/Provisioning Profiles/Parso_Tonearm_Share_Extension.mobileprovision"
          printf '%s' "$WIDGETS_EXTENSION_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            -o "$HOME/Library/MobileDevice/Provisioning Profiles/Parso_Tonearm_Widgets_Extension.mobileprovision"
          printf '%s' "$SIRI_EXTENSION_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            -o "$HOME/Library/MobileDevice/Provisioning Profiles/Parso_Tonearm_Siri_Extension.mobileprovision"
          printf '%s' "$WATCH_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            -o "$HOME/Library/MobileDevice/Provisioning Profiles/Parso_Tonearm_Watch_App_Store.mobileprovision"
          printf '%s' "$WATCH_WIDGETS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            -o "$HOME/Library/MobileDevice/Provisioning Profiles/Parso_Tonearm_Watch_Widgets_App_Store.mobileprovision"

      - name: Archive
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -eo pipefail
          # No deployment-target override here: project.yml is the single source of truth
          # (IPHONEOS_DEPLOYMENT_TARGET 27.0), so the archived product matches what every
          # validation build compiles.
          xcodebuild archive \
            -project Tonearm.xcodeproj \
            -scheme Tonearm \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ./build/Tonearm.xcarchive \
            ARCHS="arm64 arm64_32" \
            MARKETING_VERSION="$MKT_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "DEVELOPMENT_TEAM=$TEAM_ID" \
            2>&1 | tee build.log
          if [ ! -d "./build/Tonearm.xcarchive" ]; then
            echo "Archive not found — build failed"
            grep -E 'error:' build.log | head -20
            exit 1
          fi

      # Upload mode exports from the archive itself. A prior local IPA export
      # duplicates packaging/signing work and has no downstream consumer.
      - name: Upload to TestFlight
        if: env.HAS_TESTFLIGHT_SECRETS == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          upload_options="$RUNNER_TEMP/TestFlightExportOptions.plist"
          cp ExportOptions.plist "$upload_options"
          /usr/libexec/PlistBuddy -c 'Add :destination string upload' "$upload_options"
          bash .github/scripts/testflight-upload.sh -- \
            xcodebuild -exportArchive \
              -archivePath ./build/Tonearm.xcarchive \
              -exportPath ./output \
              -exportOptionsPlist "$upload_options" \
              -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8" \
              -authenticationKeyID "$APPSTORE_API_KEY_ID" \
              -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID"

      - name: Upload TestFlight transport diagnostics
        if: always() && env.HAS_TESTFLIGHT_SECRETS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: testflight-transport-${{ github.run_id }}
          path: ${{ runner.temp }}/testflight-transport.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Record TestFlight delivery
        if: success() && env.HAS_TESTFLIGHT_SECRETS == 'true'
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_TOKEN || github.token }}
          # Product name, not the internal codename — these notes are shown to
          # TestFlight testers and App Review.
          APP_NAME: Platterhead
          ARCHIVED_APP: ./build/Tonearm.xcarchive/Products/Applications/Tonearm.app
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_KEY_PATH: /Users/runner/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8
        run: bash .github/scripts/record-testflight-delivery.sh

      - name: Upload Build Log on Failure
        if: failure() && env.HAS_TESTFLIGHT_SECRETS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Cleanup
        if: always() && env.HAS_TESTFLIGHT_SECRETS == 'true'
        run: |
          security delete-keychain build.keychain || true
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
