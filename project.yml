name: Tonearm

# The models ODR overlay. `Config/models-odr.yml` is GENERATED by
# `scripts/generate-project.sh` (`make project`) from one fact per model: whether
# that converted package is on this machine. **No model package is in the
# repository** — Demucs is 210 MB of FP32 weights and has always been gitignored
# (plan dj-stems-model S6); the two CLAP encoders were committed until 2026-08-17,
# when GitHub rejected the push for exceeding its 100 MB file limit, and became
# release assets fetched by `scripts/fetch-models.sh` (`make models`). So on a
# checkout that has not fetched them — which is what CI starts from — they are
# absent and the overlay says so.
#
# It has to be an overlay rather than a plain source entry with `optional: true`.
# `optional` only silences xcodegen's spec validation; the file reference survives
# into the resources build phase, and the build then dies copying it into the
# asset pack:
#
#   CpResource .../demucs-stems-<hash>.assetpack/DemucsStems.mlpackage — ** BUILD FAILED **
#
# which is what a TestFlight archive would have hit on the first push. An absent
# tag is already the honest FR-SEM-6 absence at runtime: `beginAccessingResources`
# fails, `isAvailable` stays false, decks play the full mix and the stem faders
# stay disabled (§36.5). `relativePaths: false` keeps the overlay's paths rooted
# at the repo rather than at `Config/`.
include:
  - path: Config/models-odr.yml
    relativePaths: false

options:
  bundleIdPrefix: guru.parso
  developmentRegion: en
  knownRegions:
    - en
    - zh-Hans
    - es
    - fr
    - de
    - ja
    - pt-BR
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  TonearmCore:
    path: .
  # Audio-engine unification (parso-audio-engine/docs/UNIFICATION_PLAN.md).
  # 1.1.0 ships the Internet Archive streaming cache-key fix (see Package.swift).
  ParsoAudioEngine:
    url: https://github.com/johnarleyburns/parso-audio-engine.git
    exactVersion: 1.2.4

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "3264Y8YUGV"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    GENERATE_INFOPLIST_FILE: "NO"
    TONEARM_DROPBOX_CLIENT_ID: ""
    TONEARM_GOOGLE_DRIVE_CLIENT_ID: ""
    TONEARM_ONEDRIVE_CLIENT_ID: ""
    TONEARM_PCLOUD_CLIENT_ID: ""
    TONEARM_PCLOUD_CLIENT_SECRET: ""

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

targets:
  Tonearm:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Art/**"
          - "Audio/**"
          - "CLAMEBridge/**"
          - "CSQLiteVec/**"
          - "Data/**"
          # Compiled as the TonearmDiscovery SwiftPM product, linked below —
          # never source-compiled into the app (IMPLEMENT_CLAP_PLAN.md §3).
          - "Discovery/**"
          - "Domain/**"
          - "IA/**"
          - "Intents/**"
          - "Pro/**"
          - "Remote/**"
          - "Share/**"
          - "Snapshot/**"
          - "Sync/**"
          # Dev-only offline CLI tool (BuiltInEmbedder), compiled only via
          # `swift run` from Package.swift's executableTarget — never part of
          # the app target (its own top-level @main conflicts with the app's).
          - "Tools/**"
          - "WatchPlayback/**"
          - "WatchProtocol/**"
          - "WatchCore/**"
          - "WatchExports.swift"
          - "WatchSync/**"
      - path: Resources
        excludes:
          - "Models/**"
      # No model package is listed here. All three — CLAPAudioEncoder,
      # CLAPTextEncoder and DemucsStems — arrive through the
      # `Config/models-odr.yml` overlay at the top of this file, whose entries
      # exist only for the packages actually on the machine doing the build.
    dependencies:
      - package: TonearmCore
      - package: TonearmCore
        product: TonearmWatchProtocol
      # Unified-library CLAP indexing/search (IMPLEMENT_CLAP_PLAN.md §3).
      - package: TonearmCore
        product: TonearmDiscovery
      - package: ParsoAudioEngine
        product: ParsoAudioStreaming
      - package: ParsoAudioEngine
        product: ParsoAudioPlayback
      - package: ParsoAudioEngine
        product: ParsoAudioAnalysis
      - package: ParsoAudioEngine
        product: ParsoAudioCore
      - package: ParsoAudioEngine
        product: ParsoDJEngine
      - target: TonearmShareExtension
        embed: true
      - target: TonearmWidgetsExtension
        embed: true
      # SiriKit INPlayMediaIntent (docs/plans/carplay-search-ios27-handoff.md
      # T4). Needs its own App ID + "Platterhead Siri Extension Profile".
      - target: TonearmSiriIntents
        embed: true
      - target: TonearmWatch
        embed: true
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Platterhead
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: guru.parso.tonearm
            CFBundleURLSchemes:
              - tonearm
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UIBackgroundModes:
          - audio
          - processing
        # Durable CLAP/discovery indexing (IMPLEMENT_CLAP_PLAN.md §7).
        BGTaskSchedulerPermittedIdentifiers:
          - guru.parso.tonearm.discovery-index
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            archive.org:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: false
            itunes.apple.com:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: false
            mzstatic.com:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: false
        ITSAppUsesNonExemptEncryption: false
        NSSiriUsageDescription: "Siri can play songs, artists and playlists from your Platterhead library when you ask, including in CarPlay. Platterhead itself collects and sends nothing."
        NSMicrophoneUsageDescription: "Platterhead uses the microphone in CarPlay to hear your music searches."
        NSSpeechRecognitionUsageDescription: "Platterhead transcribes your CarPlay music search so you can find tracks hands-free."
        TonearmOAuthClientIDs:
          dropbox: "$(TONEARM_DROPBOX_CLIENT_ID)"
          googleDrive: "$(TONEARM_GOOGLE_DRIVE_CLIENT_ID)"
          oneDrive: "$(TONEARM_ONEDRIVE_CLIENT_ID)"
          pCloud: "$(TONEARM_PCLOUD_CLIENT_ID)"
        TonearmOAuthClientSecrets:
          pCloud: "$(TONEARM_PCLOUD_CLIENT_SECRET)"
        JamendoClientID: "$(TONEARM_JAMENDO_CLIENT_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.tonearm
        # iPhone + Watch only (award-and-mix-plan.md C3).
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: "3264Y8YUGV"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_ENTITLEMENTS: Sources/App/Tonearm.Debug.entitlements
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Platterhead Profile"
          CODE_SIGN_ENTITLEMENTS: Sources/App/Tonearm.entitlements

  TonearmShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    resources:
      - path: ShareExtension/Localizable.xcstrings
    dependencies:
      - package: TonearmCore
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Add to Platterhead
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.tonearm.share
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        DEVELOPMENT_TEAM: "3264Y8YUGV"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Platterhead Share Extension Profile"

  TonearmWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetsExtension
    resources:
      - path: WidgetsExtension/Localizable.xcstrings
    dependencies:
      - package: TonearmCore
    info:
      path: WidgetsExtension/Info.plist
      properties:
        CFBundleDisplayName: Platterhead Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.tonearm.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        DEVELOPMENT_TEAM: "3264Y8YUGV"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: WidgetsExtension/TonearmWidgets.entitlements
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Platterhead Widgets Profile"

  # SiriKit media requests ("Play Hotel California on Platterhead") and the
  # CarPlay "Ask Siri" assistant cell, which Apple requires an
  # INPlayMediaIntent Intents extension for (3e34979). Thin: it can't see the
  # library, so it answers .handleInApp and the app resolves the request
  # (Sources/App/Siri, SiriMediaRequest in TonearmCore).
  TonearmSiriIntents:
    type: app-extension
    platform: iOS
    sources:
      - path: SiriIntentsExtension
    resources:
      - path: SiriIntentsExtension/Localizable.xcstrings
    dependencies:
      - package: TonearmCore
      - sdk: Intents.framework
    info:
      path: SiriIntentsExtension/Info.plist
      properties:
        CFBundleDisplayName: Platterhead Siri
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.intents-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).IntentHandler"
          NSExtensionAttributes:
            IntentsRestrictedWhileLocked: []
            IntentsSupported:
              - INPlayMediaIntent
            SupportedMediaCategories:
              - INMediaCategoryMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.tonearm.siri
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        DEVELOPMENT_TEAM: "3264Y8YUGV"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Platterhead Siri Extension Profile"

  TonearmUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Tonearm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.tonearm.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Tonearm

  TonearmUIRegressionTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UIRegressionTests
    dependencies:
      - target: Tonearm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.tonearm.uiregression
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Tonearm

  TonearmWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
      # The Watch icon is the shared Icon Composer file's watchOS circle (1088 canvas).
      - path: Resources/AppIcon.icon
    resources:
      - path: WatchApp/Localizable.xcstrings
      # The deterministic smoke fixture's audio. §16: "Replace with … SwiftData
      # fixtures and bundled audio." DEBUG builds do not embed the TonearmCore
      # SPM resource bundle, so the WAV is copied into the watch bundle directly.
      - path: Resources/Audio/ambient-ocean.wav
        buildPhase: resources
    dependencies:
      - package: TonearmCore
        product: TonearmWatchProtocol
      - package: TonearmCore
        product: TonearmWatchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.tonearm.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: WatchApp/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Platterhead
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: guru.parso.tonearm
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        MARKETING_VERSION: $(MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
        TARGETED_DEVICE_FAMILY: 4
        SKIP_INSTALL: "YES"
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: true
        INFOPLIST_KEY_UIBackgroundModes: ["audio"]
      # Unlike every other target in this project, TonearmWatch had ONE
      # signing config shared across Debug and Release (Manual + the
      # Distribution profile) instead of splitting by config the way
      # `Tonearm`'s own target does above (Debug: Automatic, Release:
      # Manual). That made a plain local Debug build to a real device fail
      # outright — the Distribution certificate isn't valid for local
      # development signing, and Xcode has no reason to have that
      # certificate's private key locally anyway. Split the same way the
      # main app target already does.
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Platterhead Watch App Store"

  WatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: WatchUITests
    dependencies:
      - target: TonearmWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.tonearm.watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        TARGETED_DEVICE_FAMILY: 4

schemes:
  Tonearm:
    build:
      # This scheme embeds a watchOS target. Do not validate it with a global
      # `-sdk iphonesimulator` override; use an iOS destination so Xcode keeps
      # the embedded TonearmWatch build on watchOS (see CLAUDE.md).
      targets:
        Tonearm: all
        TonearmShareExtension: all
        TonearmWidgetsExtension: all
        TonearmWatch: all
        TonearmUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Resources/Tonearm.storekit
    test:
      config: Debug
      storeKitConfiguration: Resources/Tonearm.storekit
      targets:
        - TonearmUITests
      gatherCoverageData: false

  TonearmUIRegression:
    build:
      targets:
        Tonearm: all
        TonearmUIRegressionTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Resources/Tonearm.storekit
    test:
      config: Debug
      storeKitConfiguration: Resources/Tonearm.storekit
      targets:
        - TonearmUIRegressionTests
      gatherCoverageData: false

  TonearmWatch:
    build:
      targets:
        TonearmWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WatchUITests
