# Converted Core ML model packages, pinned.
#
# These are build inputs, not source: the Demucs package is 210 MB of converted
# weights, GitHub rejects any file over 100 MB, and committing it made `git push`
# fail outright (the third push blocker, found on 2026-08-17). It is delivered as
# a release asset instead and fetched by `scripts/fetch-models.sh`, which is what
# `make models` and the CI archive job run before generating the project.
#
# One row per package:
#
#   <url>  <sha256 of the asset>  <directory it unpacks to>  [archive-root-directory]
#
# The optional fourth field names the single top-level directory inside the
# archive (.tar.gz or .zip) that is moved to the destination; without it the
# archive root is expected to equal the destination name.
#
# The directory is relative to `Resources/Models/`. The checksum is the contract:
# a mismatch is a hard failure, never a warning, because a silently absent or
# corrupt model would ship as the honest-unavailable state and the first anyone
# would know is a tester reporting that stem separation does nothing.
#
# A full URL rather than a release tag, so where the bytes live is a hosting
# decision and not a code change — a GitHub release, an R2 bucket, anything that
# answers an unauthenticated GET. `MODELS_BASE_URL=https://host/prefix` overrides
# the host for every row (the filename is kept), which is how a fork or a mirror
# redirects without editing this file.
#
# To publish a new conversion: pack it (`tar -czf <name>.tar.gz <name>`), upload
# it under a new name or a new prefix, and update the row. Never replace bytes at
# a URL a build already resolves against — the checksum will catch it, but as a
# failed build rather than as the deliberate change it was.

# Hosted in the owner's Cloudflare R2 bucket `parso-platterhead-models`, which
# exists only for these files: its public r2.dev domain is enabled, and nothing
# else in the account is exposed by it. Egress is free, which is what makes it a
# better home than a release asset — every archive run pulls ~210 MB.
#
# The stems model is the only production row; it stays in R2.

# The stems model (plan dj-stems-model S1–S8): htdemucs converted to Core ML
# FP32, verified against torch at max|d| 1.1e-6. Pinning it here is what puts
# **stems in a CI build** — the ODR overlay picks up `demucs-stems` the moment
# the package is on disk, so a tester gets live separation instead of the honest
# unavailable state. Its S7 gate (separation timing, thermals, peak footprint on
# a real device) is still user-owned and unmeasured.
