# The stems model (plan dj-stems-model S1–S8): htdemucs converted to Core ML
# FP32, verified against torch at max|d| 1.1e-6. Pinning it here is what puts
# **stems in a CI build** — the ODR overlay picks up `demucs-stems` the moment
# the package is on disk, so a tester gets live separation instead of the honest
# unavailable state. Its S7 gate (separation timing, thermals, peak footprint on
# a real device) is still user-owned and unmeasured.
