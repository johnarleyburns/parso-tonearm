# Converted Core ML model packages, pinned.
#
# These are build inputs, not source: they are 137–240 MB of converted weights,
# GitHub rejects any file over 100 MB, and committing them made `git push` fail
# outright (the third push blocker, found on 2026-08-17). They are delivered as
# release assets instead and fetched by `scripts/fetch-models.sh`, which is what
# `make models` and the CI archive job run before generating the project.
#
# One row per package:
#
#   <url>  <sha256 of the asset>  <directory it unpacks to>
#
# The directory is relative to `Resources/Models/`. The checksum is the contract:
# a mismatch is a hard failure, never a warning, because a silently absent or
# corrupt model would ship as the honest-unavailable state and the first anyone
# would know is a tester reporting that semantic search does nothing.
#
# A full URL rather than a release tag, so where the bytes live is a hosting
# decision and not a code change — a GitHub release, an R2 bucket, anything that
# answers an unauthenticated GET. `MODELS_BASE_URL=https://host/prefix` overrides
# the host for every row (the filename is kept), which is how a fork or a mirror
# redirects without editing this file.
#
# To publish a new conversion: pack it (`tar -czf <name>.tar.gz <name>`), upload
# it under a new name or a new prefix, and update the row. Never replace bytes at
# a URL a build already resolves against — the checksum will catch it, but as a
# failed build rather than as the deliberate change it was.

