# Mood Starter databases (StarterLibrary), pinned.
#
# Build inputs, not source: the Mac database carries every track's full transition-prep waveform
# (~108 MB), over GitHub's 100 MB file limit, and binary rebuilds would bloat history. They are
# release assets fetched by scripts/fetch-starter.sh (`make starter`), which the CI test and
# archive jobs run before testing and generating the project.
#
# One row per database:
#
#   <url>  <sha256>  <file name in Resources/Starter/>
#
# Built with `swift run -c release BuiltInAnalyzer build-starter data/mood-starter/source-index.json
# <payload-dir> <out.sqlite> [--full]` from a BUILTIN_ANALYZER_PREP run. To publish a new build,
# upload it under a new release tag (never replace bytes at a URL a build already resolves) and
# update these rows.

