# Mood Starter databases (StarterLibrary), pinned.
#
# Build inputs, not source: binary rebuilds would bloat history. They are release assets fetched
# by scripts/fetch-starter.sh (`make starter`), which the CI test and archive jobs run before
# testing and generating the project. Since starter-v2 the iPhone and the Mac ship the same
# database: track metadata, embeddings and tempo/key/energy only. Blends are planned on the device
# from the audio; the tempo here is the planner's starting point. Since starter-v3 (format 3) the
# embeddings ship as 128 principal-component coordinates and are rebuilt to 512 when read (~3 MB).
#
# One row per database:
#
#   <url>  <sha256>  <file name in Resources/Starter/>
#
# Built with `swift run -c release BuiltInAnalyzer build-starter data/mood-starter/source-index.json
# Resources/Starter/starter.sqlite [--embedding-dims 128]`. To publish a new build,
# upload it under a new release tag (never replace bytes at a URL a build already resolves) and
# update these rows.

